<!DOCTYPE html>
<!--
  Balance the books: an accounting warm-up game for open days.
  BAcc (Hons) Accounting, University of the West of Scotland.

  One self-contained file. Upload it to a GitHub repository as index.html and
  switch on GitHub Pages. Students join by scanning the QR code on the big screen.

  Phone answers use PeerJS (MIT licence) and its free public relay server.
  The QR code uses qrcode-generator (MIT licence). Both are included below,
  so the page does not depend on any other website except that relay.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balance the books | BAcc Accounting warm-up</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#E8F0E3; --rule:rgba(70,110,150,.16); --margin:#C9443B;
  --ink:#17233D; --ink-soft:#4A5670; --accent:#1E6B4E; --accent-ink:#FFFFFF;
  --wrong:#B23A31; --panel:#F5F9F2; --line:#BFCDB9; --btn:#FBFDF9; --btn-ink:#17233D;
  --receipt:#FFFFFF; --receipt-ink:#23262B; --receipt-soft:#6B6F76; --receipt-rule:#C9CCD1;
  --receipt-hover:#EEF2EC; --receipt-bad:#FBE4E1; --stamp:#B8322A; --drop:rgba(23,35,61,.24);
  --sans:"Atkinson Hyperlegible","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;
  --mx:52px; --px:clamp(16px,3vw,40px); --pl:calc(var(--mx) + clamp(18px,2.5vw,36px));
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14231D; --rule:rgba(160,200,180,.07); --margin:#D9675D;
    --ink:#E7EFE8; --ink-soft:#A7B7AD; --accent:#5DBB8E; --accent-ink:#0F1C16;
    --wrong:#F08378; --panel:#1C2E26; --line:#35493F; --btn:#1A2B23; --btn-ink:#E7EFE8;
    --receipt:#ECEAE2; --receipt-ink:#23262B; --receipt-soft:#5E6268; --receipt-rule:#BDBFC2;
    --receipt-hover:#E0DED5; --receipt-bad:#F1D2CC; --stamp:#D2463B; --drop:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14231D; --rule:rgba(160,200,180,.07); --margin:#D9675D;
  --ink:#E7EFE8; --ink-soft:#A7B7AD; --accent:#5DBB8E; --accent-ink:#0F1C16;
  --wrong:#F08378; --panel:#1C2E26; --line:#35493F; --btn:#1A2B23; --btn-ink:#E7EFE8;
  --receipt:#ECEAE2; --receipt-ink:#23262B; --receipt-soft:#5E6268; --receipt-rule:#BDBFC2;
  --receipt-hover:#E0DED5; --receipt-bad:#F1D2CC; --stamp:#D2463B; --drop:rgba(0,0,0,.5);
  color-scheme:dark;
}
@media (max-width:640px){ :root{ --mx:14px; } }

html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; height:100%;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);
  color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
body::after{
  content:""; position:fixed; top:0; bottom:0; left:var(--mx); width:6px;
  border-left:1.5px solid var(--margin); border-right:1.5px solid var(--margin);
  opacity:.5; pointer-events:none; z-index:-1;
}
#app{height:100%}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.num{font-variant-numeric:tabular-nums; white-space:nowrap}
.dbl{
  text-decoration-line:underline; text-decoration-style:double;
  text-decoration-color:var(--margin); text-decoration-thickness:.06em;
  text-underline-offset:.14em; text-decoration-skip-ink:none;
}
.code-inline{font-family:var(--mono); font-weight:600; letter-spacing:.08em}

.btn{
  border:1.5px solid var(--line); background:var(--btn); color:var(--btn-ink);
  border-radius:12px; padding:12px 18px; font-weight:700; font-size:1rem;
}
.btn:hover{border-color:var(--ink-soft)}
.btn:disabled{opacity:.4; cursor:default}
.btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink); padding:14px 28px; font-size:1.15rem}
.notice{
  border-left:5px solid var(--wrong); background:var(--panel); padding:14px 18px;
  border-radius:0 12px 12px 0; max-width:46rem;
}
.notice p{margin:0 0 .5em} .notice p:last-child{margin-bottom:0}

/* Setup */
.setup{max-width:66rem; padding:clamp(24px,6vh,72px) var(--px) 56px var(--pl)}
.title{font-size:clamp(2.8rem,1.4rem + 5vw,6.5rem); line-height:.95; letter-spacing:-.025em; margin:0 0 18px}
.sub{font-size:1.15rem; color:var(--ink-soft); margin:0 0 10px}
.lede{font-size:clamp(1.1rem,.95rem + .5vw,1.4rem); max-width:44ch; margin:0}
.block{margin-top:36px}
.block h2{font-size:1.3rem; margin:0 0 4px}
.hint{color:var(--ink-soft); margin:0 0 14px; max-width:60ch}
.hint.after{margin:12px 0 0}
.block .notice{margin-top:14px}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px}
.tile{position:relative; display:block; border:2px solid var(--line); background:var(--btn); border-radius:14px; padding:14px 16px 14px 52px; cursor:pointer}
.tile input{position:absolute; left:16px; top:17px; width:22px; height:22px; margin:0; accent-color:var(--accent)}
.tile.on{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.tile-title{display:block; font-weight:700; font-size:1.12rem}
.tile-desc{display:block; margin-top:2px}
.tile-meta{display:block; color:var(--ink-soft); font-size:.92rem; margin-top:8px}
.seg{display:inline-flex; flex-wrap:wrap; border:2px solid var(--line); border-radius:12px; overflow:hidden; background:var(--btn)}
.seg label{position:relative}
.seg input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer}
.seg span{display:block; padding:10px 16px; font-weight:700}
.seg input:checked + span{background:var(--ink); color:var(--paper)}
.seg input:focus-visible + span{outline:3px solid var(--accent); outline-offset:-3px}
.names{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-top:14px; max-width:52rem}
.names span{display:block; font-size:.92rem; color:var(--ink-soft); margin-bottom:4px}
.names input{width:100%; padding:10px 12px; border:2px solid var(--line); border-radius:10px; background:var(--btn)}
.start-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:40px}
.est{color:var(--ink-soft)}
.keys{color:var(--ink-soft); font-size:.95rem; max-width:60ch; margin-top:18px}

/* Presenter screen */
.play{height:100%; display:flex; flex-direction:column}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; padding:12px var(--px) 12px var(--pl); border-bottom:3px double var(--line)}
.brand{display:flex; flex-direction:column}
.brand-title{font-weight:700; font-size:1.15rem}
.progress{color:var(--ink-soft); font-size:.95rem}
.scores{display:flex; flex-wrap:wrap; gap:10px; margin-left:auto}
.tools{display:flex; flex-wrap:wrap; gap:8px; margin-left:auto}
.scores + .tools{margin-left:0}
.team,.chip{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); border-radius:999px; background:var(--btn)}
.team{padding:4px 6px 4px 14px}
.chip{padding:7px 14px; font-weight:700}
.chip b{font-family:var(--mono); letter-spacing:.08em; font-size:1.1em}
.team-name{font-weight:700; margin-right:4px}
.team-score{font-variant-numeric:tabular-nums; min-width:2ch; text-align:center; font-weight:700; font-size:1.25rem}
.pt{width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); background:transparent; font-size:1.1rem; line-height:1; padding:0}
.pt:hover{border-color:var(--ink-soft)}
.tool{border:1.5px solid var(--line); background:var(--btn); border-radius:10px; padding:8px 12px; font-size:.95rem}
.tool:hover{border-color:var(--ink-soft)}

.stage{
  flex:1; min-height:0; overflow:auto;
  padding:clamp(18px,4vh,48px) var(--px) clamp(18px,3vh,36px) var(--pl);
  display:grid; grid-template-columns:minmax(0,1.3fr) minmax(260px,.8fr);
  gap:clamp(24px,4vw,72px); align-items:start; align-content:start;
}
.stage.solo{grid-template-columns:minmax(0,1fr); max-width:74rem}
.stage.wide{grid-template-columns:minmax(0,1fr) minmax(300px,1fr)}

.q-text{font-size:clamp(1.5rem,.9rem + 1.6vw + 1vh,3rem); line-height:1.15; font-weight:700; margin:0 0 clamp(16px,3vh,32px); max-width:28ch; text-wrap:balance}
.solo .q-text{max-width:32ch}
.opts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; max-width:46rem}
.opt{
  display:flex; align-items:center; gap:14px; text-align:left;
  padding:clamp(12px,2.2vh,22px) 18px; border:2px solid var(--line); border-radius:14px;
  background:var(--btn); color:var(--btn-ink);
  font-size:clamp(1.2rem,.8rem + 1vw + .6vh,2.1rem); font-weight:700;
  transition:border-color .15s, background-color .2s, opacity .2s;
}
.opt:hover{border-color:var(--ink-soft)}
.opt.static{cursor:default}
.opt.static:hover{border-color:var(--line)}
.opts.tf .opt{justify-content:center; font-size:clamp(1.4rem,.9rem + 1.4vw + .8vh,2.6rem)}
.letter{flex:none; width:1.8em; height:1.8em; border-radius:50%; display:grid; place-items:center; font-size:.6em; background:var(--paper); border:1.5px solid var(--line)}
.opt.chosen{border-color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt.correct,.opt.correct:hover{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:none}
.opt.correct .letter{background:transparent; border-color:currentColor}
.opt.wrong{border-color:var(--wrong); color:var(--wrong); box-shadow:none}
.opt.wrong .opt-text{text-decoration:line-through; text-decoration-thickness:2px}
.opt.muted{opacity:.42}
.opt[aria-disabled="true"]{cursor:default}
.pick-tag,.count{margin-left:auto; font-size:.5em; white-space:nowrap}
.pick-tag{font-weight:400}
.count{font-variant-numeric:tabular-nums}
.opts.tf .count{margin-left:14px}

.live{margin:clamp(14px,2.5vh,24px) 0 0; font-size:clamp(1.05rem,.85rem + .6vw,1.5rem); font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.rules{color:var(--ink-soft); font-size:clamp(1rem,.85rem + .4vw,1.3rem); margin:0; max-width:44ch}
.explain{
  margin-top:clamp(16px,3vh,28px); max-width:46rem; padding:16px 20px;
  background:var(--panel); border-left:5px solid var(--accent); border-radius:0 12px 12px 0;
  font-size:clamp(1.05rem,.85rem + .6vw + .3vh,1.5rem); line-height:1.45;
  animation:fade .3s ease-out both;
}
.explain p{margin:0 0 .5em} .explain p:last-child{margin-bottom:0}
.explain .result{font-weight:700}
.explain .study{color:var(--ink-soft); font-size:.85em}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.hint-line{color:var(--ink-soft); font-size:clamp(1rem,.85rem + .4vw,1.3rem); margin:0}

/* Receipt */
.receipt-wrap{position:relative; width:100%; max-width:460px; justify-self:center; margin-bottom:34px; filter:drop-shadow(0 10px 14px var(--drop))}
.stage.wide .receipt-wrap{max-width:560px}
.receipt{
  --zz:16px;
  background:var(--receipt); color:var(--receipt-ink); font-family:var(--mono);
  padding:22px 22px calc(22px + var(--zz));
  font-size:clamp(.95rem,.75rem + .5vw + .3vh,1.3rem);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / var(--zz) 100%;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / var(--zz) 100%;
}
.receipt.compact{font-size:clamp(.88rem,.68rem + .4vw + .25vh,1.12rem); padding-top:18px}
.receipt.compact .r-rule{margin:10px 0}
.r-head{font-weight:600; font-size:1.12em; text-align:center}
.r-sub{text-align:center; color:var(--receipt-soft); font-size:.85em; margin-top:2px}
.r-rule{border-top:2px dashed var(--receipt-rule); margin:14px 0}
.r-line{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:5px 0}
.r-line .num{font-weight:600}
.r-line.lead{font-weight:600}
.r-line.pair span:last-child{text-align:right; color:var(--receipt-soft)}
.r-total{display:flex; justify-content:space-between; align-items:baseline; gap:16px; font-weight:600; font-size:1.1em}
.r-total .num{text-decoration-line:underline; text-decoration-style:double; text-underline-offset:6px; text-decoration-skip-ink:none}
.r-total.pending .num{color:var(--receipt-soft); text-decoration:none}
.qr{width:min(100%,42vh,340px); margin:0 auto}
.qr svg{display:block; width:100%; height:auto}
.join-code{font-family:var(--mono); font-weight:600; font-size:clamp(2.2rem,1.4rem + 2.5vw,4rem); letter-spacing:.14em; text-align:center; margin:10px 0 0}
.join-url{word-break:break-all; font-size:clamp(1rem,.85rem + .4vw,1.3rem); margin:0 0 18px}

.claims{display:flex; flex-direction:column; gap:2px}
.claim{
  display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:baseline;
  width:100%; text-align:left; background:transparent; border:2px solid transparent; border-radius:10px;
  padding:4px 10px; font-family:var(--mono); font-size:inherit; color:var(--receipt-ink);
}
button.claim:hover{background:var(--receipt-hover)}
div.claim{cursor:default}
.claim .c-date{color:var(--receipt-soft); font-size:.85em; white-space:nowrap}
.claim .num{font-weight:600}
.claim.flagged{border-color:var(--stamp)}
.claim.bad,button.claim.bad:hover{background:var(--receipt-bad)}
.claim[aria-disabled="true"]{cursor:default}
.c-why{margin:2px 10px 8px; color:var(--stamp); font-family:var(--sans); font-weight:700; font-size:.85em}

.stamp{
  position:absolute; left:14px; bottom:-30px;
  border:4px solid var(--stamp); border-radius:10px; color:var(--stamp);
  font-family:var(--sans); font-weight:700; font-size:clamp(1.3rem,1rem + 1.2vw,2.3rem);
  line-height:1; padding:8px 16px 10px; transform:rotate(-12deg); opacity:.9; pointer-events:none;
}
.stamp.animate{animation:stamp .42s cubic-bezier(.2,.9,.25,1.25) both}
@keyframes stamp{
  0%{opacity:0; transform:rotate(-22deg) scale(1.9)}
  60%{opacity:1; transform:rotate(-11deg) scale(.94)}
  100%{opacity:.9; transform:rotate(-12deg) scale(1)}
}

/* Round intro, leaderboard and end screens */
.intro{max-width:54rem}
.round-no{color:var(--ink-soft); font-size:clamp(1rem,.8rem + .5vw,1.35rem); margin:0 0 10px}
.round-title{font-size:clamp(2.4rem,1.2rem + 4vw + 1vh,5.5rem); line-height:1; letter-spacing:-.02em; margin:0 0 22px}
.round-intro{font-size:clamp(1.2rem,.9rem + 1vw,2rem); line-height:1.35; max-width:34ch; margin:0 0 20px}
.study-line{font-size:clamp(1rem,.85rem + .45vw,1.35rem); color:var(--ink-soft); margin:0}
.facts{margin-top:24px; padding:18px 22px; background:var(--panel); border-left:5px solid var(--margin); border-radius:0 12px 12px 0; max-width:46rem}
.facts h3{margin:0 0 8px; font-size:1.2rem}
.facts ul{margin:0; padding-left:1.2em; font-size:clamp(1.05rem,.9rem + .4vw,1.35rem); line-height:1.5}

/* Lobby */
.players-head{font-size:clamp(1.1rem,.9rem + .5vw,1.5rem); margin:26px 0 0}
.players{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; max-width:48rem}
.pchip{display:inline-flex; align-items:center; gap:2px; padding:3px 4px 3px 14px; border:1.5px solid var(--line); border-radius:999px; background:var(--btn); font-weight:700; font-size:clamp(1rem,.9rem + .3vw,1.25rem)}
.pchip.off{opacity:.5}
.pchip button{width:30px; height:30px; border-radius:50%; border:none; background:transparent; font-size:1.15rem; line-height:1; color:var(--ink-soft); padding:0}
.pchip button:hover{color:var(--wrong)}

/* Memory match */
.mem-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(8px,1.2vw,14px); max-width:62rem}
.mcard{
  min-height:clamp(72px,14vh,150px); border-radius:12px; border:2px solid var(--ink);
  background:var(--ink); color:var(--paper); display:grid; place-items:center; text-align:center;
  padding:8px 10px; font-weight:700; font-size:clamp(1rem,.75rem + .8vw + .4vh,1.7rem); line-height:1.15;
  transition:background-color .2s, color .2s, border-color .2s;
}
.mcard .mnum{font-family:var(--mono); font-weight:600; opacity:.75}
.mcard.up{background:var(--btn); color:var(--btn-ink); cursor:default}
.mcard.up.meaning{background:var(--receipt); color:var(--receipt-ink); font-family:var(--mono); font-weight:400; font-size:clamp(.85rem,.65rem + .6vw + .3vh,1.3rem)}
.mcard.matched{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent)}
.mcard.matched.term{background:var(--accent); color:var(--accent-ink)}
.mcard.flip{animation:flip .22s ease-out}
@keyframes flip{from{transform:scaleX(.15)} to{transform:none}}
.turn{font-size:clamp(1.05rem,.85rem + .6vw,1.5rem); margin:0 0 16px}

.controls{display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:12px var(--px) 16px var(--pl); border-top:3px double var(--line)}
.controls .primary{margin-left:auto}
.timer{position:relative; overflow:hidden; font-variant-numeric:tabular-nums; min-width:9em}
.timer .bar-fill{position:absolute; left:0; bottom:0; height:4px; width:var(--p,100%); background:var(--accent); transition:width 1s linear}
.timer.done{border-color:var(--wrong); color:var(--wrong)}
.timer.done .bar-fill{width:0}
.keys-hint{color:var(--ink-soft); font-size:.88rem}

/* Student phone screen */
.pl{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:0 16px calc(24px + env(safe-area-inset-bottom,0px)) calc(var(--mx) + 16px)}
.pl-top{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 0 10px; border-bottom:3px double var(--line); margin-bottom:18px}
.pl-brand{font-weight:700}
.pl-me{display:flex; flex-direction:column; align-items:flex-end; line-height:1.2; font-weight:700; text-align:right}
.pl-score{color:var(--ink-soft); font-weight:400; font-variant-numeric:tabular-nums}
.pl-main{flex:1; display:flex; flex-direction:column}
.pl-msg{margin:auto 0; padding:24px 0}
.pl-msg h1,.pl-res h1{font-size:2rem; line-height:1.1; margin:0 0 10px}
.pl-msg p,.pl-res p{font-size:1.15rem; margin:0 0 8px}
.pl-sub{color:var(--ink-soft)}
.pl-cd{font-weight:700; color:var(--ink-soft); margin:0 0 8px; font-variant-numeric:tabular-nums; min-height:1.4em}
.pl-cd.low{color:var(--wrong)}
.pl-q{font-size:1.35rem; line-height:1.2; margin:0 0 16px}
.pl-opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pl-opts .opt{min-height:96px; font-size:1.4rem; flex-direction:column; align-items:flex-start; justify-content:center; gap:8px}
.pl-opts.tf .opt{min-height:150px; align-items:center; font-size:1.7rem}
.pl-claims{display:flex; flex-direction:column; gap:8px}
.pl-claim{display:grid; grid-template-columns:1fr auto; gap:2px 10px; text-align:left; padding:12px 14px; border:2px solid var(--line); border-radius:12px; background:var(--btn); color:var(--btn-ink); font-size:1.1rem}
.pl-claim .c-date{grid-column:1 / -1; color:var(--ink-soft); font-size:.9rem}
.pl-claim.on{border-color:var(--stamp); box-shadow:inset 0 0 0 1.5px var(--stamp)}
.pl-submit{margin-top:14px; width:100%}
.pl-res{margin:auto 0; padding:24px 0}
.pl-res.good h1{color:var(--accent)}
.pl-res.bad h1{color:var(--wrong)}
.pl-gain{font-size:1.45rem !important; font-weight:700}
.pl-rank{margin-top:18px !important; color:var(--ink-soft)}
.pl-join{display:flex; flex-direction:column; gap:14px; margin:auto 0; padding:12px 0}
.pl-join h1{font-size:2rem; margin:0}
.pl-join label{display:flex; flex-direction:column; gap:6px; font-weight:700}
.pl-join input{padding:14px; font-size:1.3rem; border:2px solid var(--line); border-radius:12px; background:var(--btn); font-weight:400; width:100%}
.pl-join input[name="code"]{font-family:var(--mono); letter-spacing:.18em; text-transform:uppercase}
.pl-note{color:var(--ink-soft); margin:0}
.pl-err{color:var(--wrong); font-weight:700; margin:0}
.pl-actions{display:flex; flex-direction:column; gap:10px}
.pl .btn.primary{width:100%}
.pl-link{color:var(--ink); font-weight:700}
.pl-memstat{font-weight:700; margin:0 0 10px}
.mem-grid.phone{grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.mem-grid.phone .mcard{min-height:88px; font-size:1.02rem; padding:6px}
.mem-grid.phone .mcard.up.meaning{font-size:.8rem}

@media (max-width:900px){ .keys-hint{display:none} }
@media (max-width:820px){
  .stage,.stage.wide{grid-template-columns:minmax(0,1fr)}
  .receipt-wrap{order:-1; justify-self:start}
}
@media (max-width:640px){
  .play{height:auto; min-height:100%}
  .stage{overflow:visible; flex:none}
  .bar{gap:8px 10px}
  .scores{margin-left:0; width:100%; gap:6px}
  .team{padding:2px 4px 2px 10px; font-size:.92rem}
  .pt{width:30px; height:30px}
  .tools{margin-left:0}
  .tool{padding:6px 10px; font-size:.88rem}
  .mem-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .controls{position:sticky; bottom:0; z-index:2; background:var(--paper); padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:480px){
  .opts{gap:10px}
  .opt{padding:12px; gap:10px}
  .claim{grid-template-columns:1fr auto}
  .claim .c-date{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){
  .stamp.animate,.explain,.mcard.flip{animation:none}
  .opt,.timer .bar-fill,.mcard{transition:none}
}
</style>

/* Scoring */
const POINTS_CORRECT = 100;   // correct answer
const POINTS_SPEED = 50;      // most bonus for an instant correct answer, falling to 0 at the time limit
const POINTS_FLAG = 50;       // each odd claim found
const POINTS_WRONG_FLAG = 25; // taken off for each normal claim flagged

const ID_PREFIX = "uwsbacc-btb-";
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const app = document.getElementById("app");
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },

};
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ord(n){ const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function sec(ms){ return (ms / 1000).toFixed(1); }
function badIdx(step){ return step.claims.map((c, i) => c.bad ? i : -1).filter(i => i >= 0); }
function correctIdx(step){ return step.type === "tf" ? (step.answer ? 0 : 1) : step.correct; }
function correctLabel(step){
  if (step.type === "tf") return step.answer ? "True" : "False";
  const c = step.correct; return "ABCD"[c] + ", " + step.opts[c];
}

/* Memory board, used on the big screen and on phones */
function makeDeck(n){
  const cards = [];
  for (let pi = 0; pi < n; pi++) cards.push({pi, side:"term"}, {pi, side:"meaning"});
  return {cards:shuffle(cards), up:[], matched:[], busy:false, last:-1, all:false};
}
function memFlip(m, i, onMatch, onMiss, redraw){
  if (!m || m.busy || m.all) return;
  const c = m.cards[i];
  if (!c || m.matched.includes(c.pi) || m.up.includes(i)) return;
  m.up.push(i); m.last = i;
  if (m.up.length === 2){
    const a = m.cards[m.up[0]], b = m.cards[m.up[1]];
    if (a.pi === b.pi){ m.matched.push(a.pi); m.up = []; if (onMatch) onMatch(); }
    else {
      m.busy = true;
      setTimeout(() => { m.up = []; m.busy = false; m.last = -1; if (onMiss) onMiss(); redraw(); }, 1000);
    }
  }
  redraw();
}
function memGridHTML(m, pairs, cls, act){
  const html = `<div class="mem-grid${cls ? " " + cls : ""}">${m.cards.map((c, i) => {
    const matched = m.matched.includes(c.pi);
    const up = m.all || matched || m.up.includes(i);
    const text = c.side === "term" ? pairs[c.pi].term : pairs[c.pi].meaning;
    const cl = "mcard " + c.side + (up ? " up" : "") + (matched ? " matched" : "") + (i === m.last && up ? " flip" : "");
    return `<button class="${cl}"${act && !up ? ` data-act="${act}"` : ""} data-i="${i}" data-key="mc${i}" aria-label="${up ? esc(text) : "Card " + (i + 1)}"${up ? ' aria-disabled="true"' : ""}>${
      up ? `<span>${esc(text)}</span>` : `<span class="mnum">${i + 1}</span>`}</button>`;
  }).join("")}</div>`;
  m.last = -1;
  return html;
}

function limitFor(step){ return (step.type === "mem" ? H.memTime : step.type === "pick" ? H.answerTime + 15 : H.answerTime) * 1000; }
function speedBonus(ms, lim){ return Math.max(0, Math.round(POINTS_SPEED * (1 - ms / lim))); }

/* ---------- Network ---------- */
function makeCode(){ let c = ""; for (let i = 0; i < 4; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return c; }

function startNet(){
  if (isLocal){ H.net = "local"; return; }
  if (typeof Peer === "undefined"){ H.net = "error"; H.netErr = "The connection code did not load."; return; }
  H.code = makeCode(); H.net = "connecting"; H.netErr = "";
  let peer;
  try { peer = new Peer(ID_PREFIX + H.code.toLowerCase(), {debug:0}); }
  catch (e){ H.net = "error"; H.netErr = "This browser cannot run phone answers."; return; }
  H.peer = peer;
  peer.on("open", () => { if (H.peer !== peer) return; H.net = "ready"; if (H.screen === "play") render(); });
  peer.on("connection", conn => {
    conn.on("data", d => onHostData(conn, d));
    conn.on("close", () => onConnClose(conn));
    conn.on("error", () => onConnClose(conn));
  });
  peer.on("disconnected", () => {
    if (H.peer === peer && !peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch (e){} }, 1500);
  });
  peer.on("error", err => {
    if (H.peer !== peer) return;
    const type = err && err.type;
    if (type === "unavailable-id"){ destroyNet(); startNet(); render(); return; }
    if (type === "peer-unavailable") return;
    if (H.net !== "ready"){
      H.net = "error";
      H.netErr = ["network","server-error","socket-error","socket-closed"].includes(type)
        ? "Could not reach the game server. Check the internet connection on this computer."
        : "Could not start phone answers (" + type + ").";
      if (H.screen === "play") render();
    }
  });
}
function destroyNet(){
  if (H.peer){ const p = H.peer; H.peer = null; try { p.destroy(); } catch (e){} }
  H.net = "off"; H.players.clear();
}

function cleanName(n){ return String(n || "").replace(/[\u0000-\u001f<>]/g, "").replace(/\s+/g, " ").trim().slice(0, 14) || "Player"; }
function uniqueName(name, pid){
  const base = name; let k = 2;
  const taken = n => [...H.players.values()].some(p => p.pid !== pid && p.name.toLowerCase() === n.toLowerCase());
  while (taken(name)) name = base.slice(0, 11) + " " + (k++);
  return name;
}

function onHostData(conn, d){
  if (!d || typeof d !== "object") return;
  if (d.t === "hello"){
    const pid = String(d.pid || "").slice(0, 48);
    if (!pid) return;
    if (H.kicked.has(pid)){ try { conn.send({t:"kicked"}); } catch (e){} setTimeout(() => { try { conn.close(); } catch (e){} }, 400); return; }
    let p = H.players.get(pid);
    if (!p){ p = {pid, name:uniqueName(cleanName(d.name), pid), score:0}; H.players.set(pid, p); }
    if (p.conn && p.conn !== conn){ try { p.conn.close(); } catch (e){} }
    p.conn = conn; p.online = true; conn._pid = pid;
    sendTo(p); refreshPlayers();
    return;
  }
  const p = H.players.get(conn._pid);
  if (!p) return;
  if (d.t === "ans") handleAnswer(p, d);
  else if (d.t === "mem") handleMem(p, d);
}
function onConnClose(conn){
  const p = H.players.get(conn._pid);
  if (p && p.conn === conn){ p.online = false; refreshPlayers(); }
}
function sendTo(p){ if (p.online && p.conn && p.conn.open){ try { p.conn.send(playerMsg(p)); } catch (e){} } }
function broadcast(){ H.players.forEach(sendTo); }
function broadcastTick(){
  const msg = {t:"tick", left:H.timerLeft, paused:!H.timerId};
  H.players.forEach(p => { if (p.online && p.conn && p.conn.open){ try { p.conn.send(msg); } catch (e){} } });
}
function refreshPlayers(){
  if (H.screen === "play" && cur() && cur().kind === "lobby"){ render(); return; }
  const pc = document.getElementById("pcount");
  if (pc) pc.textContent = onlinePlayers().length + " online";
  updateLive();
  if (H.screen === "play" && cur() && cur().kind === "q" && ss().open) checkAllIn();
}
function kick(pid){
  const p = H.players.get(pid);
  if (!p || !window.confirm(`Remove ${p.name} from the game?`)) return;
  H.kicked.add(pid);
  try { if (p.conn) p.conn.send({t:"kicked"}); } catch (e){}
  setTimeout(() => { try { if (p.conn) p.conn.close(); } catch (e){} }, 400);
  H.players.delete(pid);
  render();
}

function handleAnswer(p, d){
  const sl = cur();
  if (H.screen !== "play" || !sl || sl.kind !== "q" || d.qid !== H.idx) return;
  const s = ss(), step = sl.s;
  if (s.revealed || !s.open || s.answers[p.pid]) return;
  const ms = performance.now() - s.startedAt;
  if (step.type === "pick"){
    const max = step.claims.length;
    let picks = Array.isArray(d.picks) ? d.picks.filter(x => Number.isInteger(x) && x >= 0 && x < max) : [];
    picks = [...new Set(picks)].slice(0, badIdx(step).length);
    if (!picks.length) return;
    s.answers[p.pid] = {picks, ms};
  } else if (step.type === "tf" || step.type === "mc"){
    const n = step.type === "tf" ? 2 : step.opts.length;
    if (!Number.isInteger(d.choice) || d.choice < 0 || d.choice >= n) return;
    s.answers[p.pid] = {choice:d.choice, ms};
  } else return;
  sendTo(p); updateLive(); checkAllIn();
}
function handleMem(p, d){
  const sl = cur();
  if (H.screen !== "play" || !sl || sl.kind !== "q" || sl.s.type !== "mem" || d.qid !== H.idx) return;
  const s = ss();
  if (s.revealed || !s.open) return;
  const prev = s.memp[p.pid] || {pairs:0, done:false, ms:0};
  if (prev.done) return;
  const pairs = Math.max(prev.pairs, Math.min(H.pairs.length, d.pairs | 0));
  const done = pairs === H.pairs.length;
  s.memp[p.pid] = {pairs, done, ms:done ? performance.now() - s.startedAt : 0};
  if (done) sendTo(p);
  updateLive(); checkAllIn();
}
function checkAllIn(){
  const sl = cur(), s = ss(), on = onlinePlayers();
  if (!on.length || s.revealed || s.pendingReveal) return;
  const all = sl.s.type === "mem" ? on.every(p => s.memp[p.pid] && s.memp[p.pid].done) : on.every(p => s.answers[p.pid]);
  if (all){
    s.pendingReveal = true;
    const idx = H.idx;
    setTimeout(() => { if (H.idx === idx && !ss().revealed) reveal(); }, 900);
  }
}

function scoreSlide(step, s){
  if (s.scored) return;
  s.results = {};
  const lim = limitFor(step);
  H.players.forEach(p => {
    const r = {answered:false, ok:false, gained:0, bonus:0};
    if (step.type === "tf" || step.type === "mc"){
      const a = s.answers[p.pid];
      if (a){ r.answered = true; if (a.choice === correctIdx(step)){ r.ok = true; r.gained = POINTS_CORRECT; r.bonus = speedBonus(a.ms, lim); } }
    } else if (step.type === "pick"){
      const a = s.answers[p.pid], bad = badIdx(step);
      if (a){
        r.answered = true;
        const good = a.picks.filter(i => bad.includes(i)).length, wrong = a.picks.length - good;
        r.found = good;
        r.gained = Math.max(0, POINTS_FLAG * good - POINTS_WRONG_FLAG * wrong);
        if (good === bad.length && !wrong){ r.ok = true; r.bonus = speedBonus(a.ms, lim); }
      }
    } else if (step.type === "mem"){
      const m = s.memp[p.pid];
      r.pairs = m ? m.pairs : 0;
      if (m){ r.answered = true; r.gained = POINTS_PAIR * m.pairs; if (m.done){ r.ok = true; r.bonus = speedBonus(m.ms, lim); } }
    }
    p.score += r.gained + r.bonus;
    s.results[p.pid] = r;
  });
  s.scored = true;
}

function resultFor(step, r){
  const plus = [];
  if (r.gained) plus.push(`+${r.gained} points`);
  if (r.bonus) plus.push(`+${r.bonus} ${step.type === "mem" ? "finish" : "speed"} bonus`);
  if (step.type === "mem"){
    const n = H.pairs.length;
    if (!r.answered) return {tone:"bad", head:"No pairs matched", lines:["Watch the big screen to see all the pairs."]};
    return {tone:r.ok ? "good" : "none", head:r.ok ? "All pairs matched" : `${r.pairs} of ${n} pairs`, lines:plus};
  }
  if (step.type === "pick"){
    const odd = step.claims.filter(c => c.bad).map(c => c.item.toLowerCase()).join(" and the ");
    const line = `The odd claims were the ${odd}.`;
    if (!r.answered) return {tone:"bad", head:"No answer", lines:[line]};
    if (r.ok) return {tone:"good", head:"You found both", lines:plus};
    return {tone:r.found ? "none" : "bad", head:`You found ${r.found} of 2`, lines:plus.concat(line)};
  }
  const line = `The answer was ${correctLabel(step)}.`;
  if (r.ok) return {tone:"good", head:"Correct", lines:plus};
  return {tone:"bad", head:r.answered ? "Not this time" : "No answer", lines:[line]};
}

/* What each phone should show right now */
function playerMsg(p){
  const base = {t:"view", name:p.name, score:p.score, rank:rankOf(p), n:H.players.size};
  const sl = cur();
  if (H.screen !== "play" || !sl) return {...base, view:"wait", vk:"wait-setup", title:"You are in", text:"Watch the big screen. The game starts soon."};
  if (sl.kind === "lobby") return {...base, view:"wait", vk:"wait-lobby", title:"You are in", text:"Watch the big screen. The game starts soon."};
  if (sl.kind === "intro") return {...base, view:"wait", vk:"intro-" + H.idx, sub:`Round ${sl.ri + 1} of ${sl.rn}`, title:sl.r.title, text:sl.r.introPhones || sl.r.intro};
  if (sl.kind === "board") return {...base, view:"board", vk:"board-" + H.idx};
  if (sl.kind === "end") return {...base, view:"end", vk:"end"};
  const s = ss(), step = sl.s;
  if (s.revealed){
    const r = (s.results || {})[p.pid] || {answered:false, ok:false, gained:0, bonus:0, pairs:0, found:0};
    return {...base, view:"result", vk:"res-" + H.idx, res:resultFor(step, r)};
  }
  const left = H.timerLeft;
  if (step.type === "mem"){
    const m = s.memp[p.pid];
    if (m && m.done) return {...base, view:"locked", vk:"lock-" + H.idx, title:"All pairs found", text:"Wait for the results on the big screen."};
    return {...base, view:"mem", vk:"mem-" + H.idx, qid:H.idx, pairs:H.pairs, left, paused:!H.timerId};
  }
  if (s.answers[p.pid]) return {...base, view:"locked", vk:"lock-" + H.idx, title:"Answer locked in", text:"Wait for the reveal on the big screen."};
  const q = {...base, view:"q", vk:"q-" + H.idx, qid:H.idx, kind:step.type, q:step.q, left, paused:!H.timerId};
  if (step.type === "tf"){ q.opts = ["True","False"]; q.letters = false; }
  else if (step.type === "mc"){ q.opts = step.opts; q.letters = true; }
  else if (step.type === "pick"){ q.claims = step.claims.map(c => ({date:c.date, item:c.item, amt:c.amt})); q.need = badIdx(step).length; }
  return q;
}

  return `<main class="setup">
    <h1 class="title"><span class="dbl">Balance the books</span></h1>
    <p class="sub">BAcc (Hons) Accounting, University of the West of Scotland</p>
    <p class="lede">A short accounting game to open your session. Every round links to a module on the course.</p>
    <section class="block">
      <h2>How students answer</h2>
      <div class="seg" role="radiogroup" aria-label="How students answer">${seg("mode", [["phones","On their phones"],["hands","Show of hands"]], H.mode)}</div>
      <p class="hint after">${modeHint}</p>
      ${localNote}
    </section>
    <section class="block">
      <h2>Choose rounds</h2>
      <p class="hint">Three rounds are enough for a warm-up.</p>
      <div class="tiles">${tiles}</div>
    </section>
    ${settings}
    <div class="start-row">
      <button class="btn primary" id="startBtn" data-act="start" data-key="start"${H.selected.size ? "" : " disabled"}>${phones ? "Open the joining screen" : "Start game"}</button>
      <span class="est" id="est">${estText()}</span>
    </div>
    <p class="keys">In the game, the right arrow or Page Down reveals the answer and then moves on. The left arrow or Page Up goes back. Most presentation clickers send these keys. F switches to full screen.</p>
  </main>`;
}

/* ---------- Presenter game screen ---------- */
function progressText(sl){
  if (sl.kind === "lobby") return "Waiting for players";
  if (sl.kind === "intro") return `Round ${sl.ri + 1} of ${sl.rn}`;
  if (sl.kind === "q") return sl.s.type === "mem" || sl.r.steps.length === 1 ? `Round ${sl.ri + 1} of ${sl.rn}` : `Round ${sl.ri + 1} of ${sl.rn}, question ${sl.si + 1} of ${sl.r.steps.length}`;
  if (sl.kind === "board") return `Leaderboard after round ${sl.ri + 1} of ${sl.rn}`;
  return "Final balance";
}
function primaryLabel(sl){
  if (sl.kind === "lobby") return "Start game";
  if (sl.kind === "intro") return "Start round";
  if (sl.kind === "q" && !ss().revealed) return sl.s.type === "mem" ? (isPhones() ? "Show the pairs" : "Show all cards") : "Reveal answer";
  const nx = H.slides[H.idx + 1];
  if (nx.kind === "end") return "See results";
  if (nx.kind === "board") return "Show leaderboard";
  if (nx.kind === "intro") return "Next round";
  return "Next question";
}

function barHTML(sl){
  let mid = "";
  if (isPhones()) mid = `<div class="scores"><span class="chip">Join code <b>${esc(H.code || "....")}</b></span><span class="chip" id="pcount">${onlinePlayers().length} online</span></div>`;
  else if (H.teamCount) mid = `<div class="scores" aria-label="Team scores">${
    Array.from({length:H.teamCount}, (_, i) => {
      const n = esc(teamName(i));
      return `<div class="team"><span class="team-name">${n}</span>
        <button class="pt" data-act="ptm" data-i="${i}" data-key="m${i}" aria-label="Take a point from ${n}">−</button>
        <span class="team-score" aria-live="polite">${H.scores[i]}</span>
        <button class="pt" data-act="ptp" data-i="${i}" data-key="p${i}" aria-label="Add a point to ${n}">+</button></div>`;
    }).join("")}</div>`;
  return `<header class="bar">
    <div class="brand"><span class="brand-title">Balance the books</span><span class="progress">${esc(progressText(sl))}</span></div>
    ${mid}
    <div class="tools">
      <button class="tool" data-act="theme" data-key="theme">${currentTheme() === "dark" ? "Light screen" : "Dark screen"}</button>
      ${canFS ? `<button class="tool" data-act="fs" data-key="fs">${document.fullscreenElement ? "Exit full screen" : "Full screen"}</button>` : ""}
      <button class="tool" data-act="setup" data-key="setup">Setup</button>
    </div>
  </header>`;
}

function explainHTML(step, r, extra){
  const study = step.study !== undefined ? step.study : r.study;
  const jobs = step.jobs !== undefined ? step.jobs : r.jobs;
  return `<div class="explain" role="status">
    ${extra ? `<p class="result">${esc(extra)}</p>` : ""}
    <p>${esc(step.explain)}</p>
    ${study ? `<p class="study">You learn this in ${esc(study)}.${jobs ? ` Jobs it leads to: ${esc(jobs)}.` : ""}</p>` : ""}
  </div>`;
}
function stampHTML(text){ return `<div class="stamp${H.justRevealed ? " animate" : ""}" aria-hidden="true">${esc(text)}</div>`; }

function statLine(step, s){
  if (step.type === "mem"){
    const all = Object.entries(s.memp);
    if (!all.length) return "No one matched a pair this time.";
    const done = all.filter(([, m]) => m.done).sort((a, b) => a[1].ms - b[1].ms);
    const n = H.players.size;
    let t = `${done.length} of ${n} ${n === 1 ? "player" : "players"} matched every pair.`;
    if (done.length) t += ` Fastest: ${playerName(done[0][0])}, ${sec(done[0][1].ms)} seconds.`;
    return t;
  }
  const all = Object.entries(s.answers);
  if (!all.length) return "No answers came in.";
  let ok;
  if (step.type === "pick"){ const bad = badIdx(step); ok = all.filter(([, a]) => a.picks.length === bad.length && a.picks.every(i => bad.includes(i))); }
  else { const c = correctIdx(step); ok = all.filter(([, a]) => a.choice === c); }
  ok.sort((a, b) => a[1].ms - b[1].ms);
  const n = all.length;
  let t = step.type === "pick"
    ? `${ok.length} of ${n} ${n === 1 ? "player" : "players"} found both.`
    : `${ok.length} of ${n} ${n === 1 ? "answer was" : "answers were"} correct.`;
  if (ok.length) t += ` Fastest: ${playerName(ok[0][0])}, ${sec(ok[0][1].ms)} seconds.`;
  return t;
}
function liveText(){
  const sl = cur(), s = ss(), on = onlinePlayers().length;
  if (sl.s.type === "mem") return `Finished: ${Object.values(s.memp).filter(m => m.done).length} of ${on}`;
  return `Answers in: ${Object.keys(s.answers).length} of ${on}`;
}
function finishersHTML(s){
  const done = Object.entries(s.memp).filter(([, m]) => m.done).sort((a, b) => a[1].ms - b[1].ms).slice(0, 8);
  if (!done.length) return `<div class="r-line"><span>No one yet</span><span></span></div>`;
  return done.map(([pid, m], i) => `<div class="r-line${i === 0 ? " lead" : ""}"><span>${i + 1}. ${esc(playerName(pid))}</span><span class="num">${sec(m.ms)} s</span></div>`).join("");
}
function updateLive(){
  if (H.screen !== "play") return;
  const sl = cur();
  if (!sl || sl.kind !== "q" || !isPhones()) return;
  const l = document.getElementById("live");
  if (l) l.textContent = liveText();
  const f = document.getElementById("finishers");
  if (f) f.innerHTML = finishersHTML(ss());
}

function optionsHTML(step, s, extraClass){
  const opts = step.type === "tf" ? ["True","False"] : step.opts;
  const correct = correctIdx(step), letters = step.type !== "tf", phones = isPhones();
  const counts = phones && s.revealed ? opts.map((_, i) => Object.values(s.answers).filter(a => a.choice === i).length) : null;
  return `<div class="opts${extraClass ? " " + extraClass : ""}">${opts.map((o, i) => {
    let c = "opt" + (phones ? " static" : "");
    if (!phones && s.choice === i) c += " chosen";
    if (s.revealed){ if (i === correct) c += " correct"; else if (!phones && s.choice === i) c += " wrong"; else c += " muted"; }
    const act = phones ? "" : ` data-act="opt" data-i="${i}" data-key="o${i}" aria-pressed="${s.choice === i}"`;
    return `<button class="${c}"${act}${s.revealed || phones ? ' aria-disabled="true"' : ""}>
      ${letters ? `<span class="letter" aria-hidden="true">${"ABCD"[i]}</span>` : ""}<span class="opt-text">${esc(o)}</span>
      ${counts ? `<span class="count">${counts[i]} ${counts[i] === 1 ? "vote" : "votes"}</span>` : ""}
      ${!phones && s.revealed && s.choice === i ? `<span class="pick-tag">Room’s pick</span>` : ""}
    </button>`;
  }).join("")}</div>`;
}
function receiptTop(rc){ return `<div class="r-head">${esc(rc.head)}</div>${rc.sub ? `<div class="r-sub">${esc(rc.sub)}</div>` : ""}<div class="r-rule"></div>`; }
function boardReceipt(head, sub){
  const rows = ranked().slice(0, 10);
  return `<aside class="receipt-wrap" aria-label="${esc(head)}"><div class="receipt">
    ${receiptTop({head, sub})}
    ${rows.length ? rows.map((p, i) => `<div class="r-line${i === 0 ? " lead" : ""}"><span>${rankOf(p)}. ${esc(p.name)}</span><span class="num">${p.score}</span></div>`).join("") : `<div class="r-line"><span>No players</span><span></span></div>`}
    <div class="r-rule"></div>
    <div class="r-total"><span>Players</span><span class="num">${H.players.size}</span></div>
  </div></aside>`;
}

function lobbyHTML(){
  const players = [...H.players.values()];
  const ready = H.net === "ready";
  let side;
  if (H.net === "local") side = `<div class="notice"><p><b>Phones cannot join this copy.</b></p><p>This page is open from a file on this computer. Open the game from its GitHub Pages link, or go back to setup and choose show of hands.</p></div>`;
  else if (H.net === "error") side = `<div class="notice"><p><b>Phone answers are not working.</b></p><p>${esc(H.netErr)}</p><p><button class="btn" data-act="netretry" data-key="netretry">Try again</button></p><p>If this keeps failing, go back to setup and choose show of hands.</p></div>`;
  else if (!ready) side = `<aside class="receipt-wrap"><div class="receipt">${receiptTop({head:"Scan to join", sub:"Balance the books"})}<p style="text-align:center">Setting up the game. This takes a few seconds.</p></div></aside>`;
  else {
    let qr = "";
    try { const q = qrcode(0, "M"); q.addData(joinURL()); q.make(); qr = q.createSvgTag({cellSize:4, margin:8, scalable:true, alt:"QR code to join the game"}); } catch (e){}
    side = `<aside class="receipt-wrap" aria-label="Join details"><div class="receipt">${receiptTop({head:"Scan to join", sub:"Balance the books"})}<div class="qr">${qr}</div><div class="join-code">${esc(H.code)}</div></div></aside>`;
  }
  return `<section class="intro">
    <h2 class="round-title">Join on your phone</h2>
    ${ready ? `<p class="round-intro">Scan the code, or open this link and enter the code <span class="code-inline">${esc(H.code)}</span>.</p><p class="join-url">${esc(joinURL())}</p>` : ""}
    <p class="rules">A correct answer earns ${POINTS_CORRECT} points. Answer fast for up to ${POINTS_SPEED} bonus points.</p>
    <h3 class="players-head">${players.length} ${players.length === 1 ? "player" : "players"} joined</h3>
    <div class="players">${players.length ? players.map(p => `<span class="pchip${p.online ? "" : " off"}">${esc(p.name)}<button data-act="kick" data-pid="${esc(p.pid)}" aria-label="Remove ${esc(p.name)}">×</button></span>`).join("") : `<span class="rules">No one yet.</span>`}</div>
  </section>${side}`;
}

function stageHTML(sl){
  if (sl.kind === "lobby") return lobbyHTML();

  if (sl.kind === "intro"){
    const r = sl.r;
    return `<section class="intro">
      <p class="round-no">Round ${sl.ri + 1} of ${sl.rn}</p>
      <h2 class="round-title">${esc(r.title)}</h2>
      <p class="round-intro">${esc(isPhones() && r.introPhones ? r.introPhones : r.intro)}</p>
      <p class="study-line">You learn this in ${esc(r.study)}.</p>
    </section>`;
  }

  if (sl.kind === "board"){
    return `<section class="intro">
      <p class="round-no">After round ${sl.ri + 1} of ${sl.rn}</p>
      <h2 class="round-title">Leaderboard</h2>
      <p class="round-intro">Each phone shows its own position. Points carry over to the next round.</p>
    </section>${boardReceipt("Leaderboard", `After round ${sl.ri + 1}`)}`;
  }

  if (sl.kind === "end"){
    let lead = "That is the end of the warm-up.", side = "";
    if (isPhones()){
      const rows = ranked();
      if (rows.length){
        const top = rows[0].score, leaders = rows.filter(p => p.score === top);
        lead = leaders.length > 1 ? `It is a tie on ${top} points.` : `${leaders[0].name} wins with ${top} points.`;
      }
      side = boardReceipt("Final leaderboard", "Balance the books");
    } else if (H.teamCount){
      const rows = Array.from({length:H.teamCount}, (_, i) => ({n:teamName(i), s:H.scores[i]})).sort((a, b) => b.s - a.s);
      const top = rows[0].s, leaders = rows.filter(x => x.s === top);
      lead = leaders.length > 1 ? `It is a tie on ${top} ${top === 1 ? "point" : "points"}.` : `${leaders[0].n} wins with ${top} ${top === 1 ? "point" : "points"}.`;
      const sum = rows.reduce((a, x) => a + x.s, 0);
      side = `<aside class="receipt-wrap" aria-label="Final scores"><div class="receipt">
        ${receiptTop({head:"Final scores", sub:"Balance the books"})}
        ${rows.map(x => `<div class="r-line"><span>${esc(x.n)}</span><span class="num">${x.s}</span></div>`).join("")}
        <div class="r-rule"></div>
        <div class="r-total"><span>Points awarded</span><span class="num">${sum}</span></div>
      </div></aside>`;
    }
    return `<section class="intro">
      <h2 class="round-title"><span class="dbl">Books balanced</span></h2>
      <p class="round-intro">${esc(lead)}</p>
      <div class="facts"><h3>About the BAcc (Hons) Accounting at UWS</h3><ul>${FACTS.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>
    </section>${side}`;
  }

  const r = sl.r, step = sl.s, s = ss(), phones = isPhones();
  const live = phones && !s.revealed ? `<p class="live" id="live" aria-live="polite">${liveText()}</p>` : "";

  if (step.type === "tf"){
    return `<section class="ask">
      <p class="q-text">${esc(step.q)}</p>
      ${optionsHTML(step, s, "tf")}
      ${live}
      ${s.revealed ? explainHTML(step, r, phones ? statLine(step, s) : "") : ""}
    </section>`;
  }

  if (step.type === "mem"){
    if (!phones){
      const m = s.mem;
      const turn = H.teamCount && !s.revealed ? `Turn: <b>${esc(teamName(s.turn))}</b>. ` : "";
      return `<section class="ask">
        <p class="q-text">${esc(step.q)}</p>
        <p class="turn">${turn}Pairs found: ${m.matched.length} of ${H.pairs.length}.</p>
        ${memGridHTML(m, H.pairs, "", s.revealed ? "" : "hflip")}
        ${s.revealed ? explainHTML(step, r) : ""}
      </section>`;
    }
    const side = s.revealed
      ? `<aside class="receipt-wrap" aria-label="The pairs"><div class="receipt compact">
          ${receiptTop({head:"The pairs", sub:"Memory match"})}
          ${H.pairs.map(pr => `<div class="r-line pair"><span><b>${esc(pr.term)}</b></span><span>${esc(pr.meaning)}</span></div>`).join("")}
          <div class="r-rule"></div>
          <div class="r-total"><span>Pairs</span><span class="num">${H.pairs.length}</span></div>
        </div>${stampHTML("Checked")}</aside>`
      : `<aside class="receipt-wrap" aria-label="Finish line"><div class="receipt">
          ${receiptTop({head:"Finish line", sub:"Fastest to match every pair"})}
          <div id="finishers">${finishersHTML(s)}</div>
        </div></aside>`;
    return `<section class="ask">
      <p class="q-text">Match each term with its meaning on your phone.</p>
      <p class="rules">Each pair earns ${POINTS_PAIR} points. Match every pair fast for up to ${POINTS_SPEED} bonus points.</p>
      ${live}
      ${s.revealed ? explainHTML(step, r, statLine(step, s)) : ""}
    </section>${side}`;
  }

  const rc = step.receipt || r.receipt;

  if (step.type === "pick"){
    const bad = badIdx(step);
    let extra = "";
    if (s.revealed){
      if (phones) extra = statLine(step, s);
      else if (s.picks.length) extra = `The room flagged ${s.picks.length} and found ${s.picks.filter(i => bad.includes(i)).length} of ${bad.length}.`;
    }
    return `<section class="ask">
      <p class="q-text">${esc(step.q)}</p>
      ${s.revealed ? explainHTML(step, r, extra) : `<p class="hint-line">${phones ? "Pick two claims on your phone." : "Select a claim to flag it."}</p>${live}`}
    </section>
    <aside class="receipt-wrap" aria-label="Expense claims">
      <div class="receipt compact">
        ${receiptTop(rc)}
        <div class="claims">${step.claims.map((c, i) => {
          const f = !phones && s.picks.includes(i);
          const cls = "claim" + (f ? " flagged" : "") + (s.revealed && c.bad ? " bad" : "");
          const inner = `<span class="c-date">${esc(c.date)}</span><span class="c-item">${esc(c.item)}</span><span class="num">${esc(c.amt)}</span>`;
          const row = phones
            ? `<div class="${cls}">${inner}</div>`
            : `<button class="${cls}" data-act="claim" data-i="${i}" data-key="c${i}" aria-pressed="${f}"${s.revealed ? ' aria-disabled="true"' : ""}>${inner}</button>`;
          return row + (s.revealed && c.bad ? `<p class="c-why">${esc(c.why)}</p>` : "");
        }).join("")}</div>
        <div class="r-rule"></div>
        <div class="r-total${s.revealed ? "" : " pending"}"><span>${esc(step.total)}</span><span class="num">${s.revealed ? esc(step.answerText) : "?"}</span></div>
      </div>
      ${s.revealed ? stampHTML("Checked") : ""}
    </aside>`;
  }

  return `<section class="ask">
    <p class="q-text">${esc(step.q)}</p>
    ${optionsHTML(step, s, "")}
    ${live}
    ${s.revealed ? explainHTML(step, r, phones ? statLine(step, s) : "") : ""}
  </section>
  <aside class="receipt-wrap" aria-label="Figures">
    <div class="receipt">
      ${receiptTop(rc)}
      ${rc.lines.map(([a, b]) => `<div class="r-line"><span>${esc(a)}</span><span class="num">${esc(b)}</span></div>`).join("")}
      <div class="r-rule"></div>
      <div class="r-total${s.revealed ? "" : " pending"}"><span>${esc(step.total)}</span><span class="num">${s.revealed ? esc(step.opts[step.correct]) : "?"}</span></div>
    </div>
    ${s.revealed ? stampHTML("Checked") : ""}
  </aside>`;
}

function controlsHTML(sl){
  const showTimer = sl.kind === "q" && !ss().revealed && (isPhones() || H.timer);
  const hints = ["→ reveal or next", "← back"];
  if (showTimer) hints.push(isPhones() ? "T pause timer" : "T timer");
  if (!isPhones() && H.teamCount) hints.push(`1 to ${H.teamCount} add a point`);
  return `<footer class="controls">
    <button class="btn" data-act="back" data-key="back"${H.idx === 0 ? " disabled" : ""}>Back</button>
    ${showTimer ? `<button class="btn timer" id="timerBtn" data-act="timer" data-key="timer"><span class="t-label"></span><span class="bar-fill"></span></button>` : ""}
    <span class="keys-hint">${hints.join(", ")}</span>
    ${sl.kind === "end"
      ? `<button class="btn primary" data-act="again" data-key="again">Play again</button>`
      : `<button class="btn primary" data-act="primary" data-key="primary">${primaryLabel(sl)}</button>`}
  </footer>`;
}

function stageClass(sl){
  if (sl.kind === "intro") return " solo";
  if (sl.kind === "lobby" || sl.kind === "board") return "";
  if (sl.kind === "end") return isPhones() || H.teamCount ? "" : " solo";
  if (sl.s.type === "pick") return " wide";
  if (sl.s.type === "mem") return isPhones() ? " wide" : " solo";
  return sl.s.type === "tf" ? " solo" : "";
}
function playHTML(){
  const sl = cur();
  return `<div class="play">${barHTML(sl)}<main class="stage${stageClass(sl)}" id="stage">${stageHTML(sl)}</main>${controlsHTML(sl)}</div>`;
}

function render(){
  const ae = document.activeElement;
  const key = ae && ae.dataset ? ae.dataset.key : null;
  app.innerHTML = H.screen === "setup" ? setupHTML() : playHTML();
  H.justRevealed = false;
  if (key && H.kbd){
    const el = app.querySelector(`[data-key="${key}"]`);
    if (el && !el.disabled) el.focus({preventScroll:true});
  }
  if (H.screen === "play") updateTimer();
}

/* ---------- Timer ---------- */
function stopTimer(){ clearInterval(H.timerId); H.timerId = null; }
function resetTimer(){ stopTimer(); H.timerTotal = H.timer; H.timerLeft = H.timer; H.timerAuto = false; }
function runTimer(){
  stopTimer();
  const idx = H.idx;
  H.timerId = setInterval(() => {
    H.timerLeft -= 1;
    if (H.timerLeft <= 0){
      H.timerLeft = 0; stopTimer(); updateTimer();
      if (H.timerAuto && H.idx === idx && !ss().revealed) reveal();
      return;
    }
    updateTimer();
  }, 1000);
  updateTimer();
}
function toggleTimer(){
  if (H.screen !== "play" || cur().kind !== "q") return;
  if (!isPhones() && !H.timer) return;
  if (H.timerId){ stopTimer(); updateTimer(); if (isPhones()) broadcastTick(); return; }
  if (ss().revealed) return;
  if (H.timerLeft <= 0) H.timerLeft = H.timerTotal;
  runTimer();
  if (isPhones()) broadcastTick();
}
function updateTimer(){
  const b = document.getElementById("timerBtn");
  if (!b) return;
  const left = H.timerLeft, total = H.timerTotal || 1;
  const t = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  let label;
  if (left <= 0) label = "Time is up";
  else if (H.timerId) label = t;
  else if (left === total && !H.timerAuto) label = "Start timer " + t;
  else label = "Paused " + t;
  b.querySelector(".t-label").textContent = label;
  b.style.setProperty("--p", (left / total * 100) + "%");
  b.classList.toggle("done", left <= 0);
}

/* ---------- Moving through the game ---------- */
function prepareSlide(){
  resetTimer();
  const sl = cur();
  if (!sl || sl.kind !== "q") return;
  const s = ss(), step = sl.s;
  if (step.type === "mem" && !s.mem){ s.mem = makeDeck(H.pairs.length); s.turn = 0; }
  if (!isPhones() || s.revealed) return;
  if (!s.open){ s.open = true; s.startedAt = performance.now(); s.answers = {}; s.memp = {}; }
  const total = Math.round(limitFor(step) / 1000);
  H.timerTotal = total; H.timerAuto = true;
  H.timerLeft = Math.max(0, Math.ceil(total - (performance.now() - s.startedAt) / 1000));
  if (H.timerLeft > 0) runTimer();
  else setTimeout(() => { if (!ss().revealed) reveal(); }, 0);
}
function go(i){
  if (i < 0 || i >= H.slides.length) return;
  H.idx = i; prepareSlide(); render();
  if (isPhones()) broadcast();
}
function reveal(){
  const sl = cur(), s = ss();
  if (s.revealed) return;
  if (sl.s.type === "mem" && s.mem) s.mem.all = true;
  s.revealed = true; s.open = false; H.justRevealed = true; stopTimer();
  if (isPhones()) scoreSlide(sl.s, s);
  render();
  if (isPhones()) broadcast();
}
function primary(){
  const sl = cur();
  if (sl.kind === "q" && !ss().revealed){ reveal(); return; }
  if (sl.kind === "end") return;
  go(H.idx + 1);
}
function start(){
  if (!H.selected.size) return;
  buildSlides(); H.idx = 0; H.ss = {}; H.scores = [0,0,0,0];
  if (isPhones()){ H.players.forEach(p => { p.score = 0; }); if (!H.peer) startNet(); }
  else destroyNet();
  H.screen = "play";
  prepareSlide(); render();
  if (isPhones()) broadcast();
}
function backToSetup(){
  stopTimer(); H.screen = "setup"; render(); window.scrollTo(0, 0);
  if (isPhones()) broadcast();
}
function addPoint(i, d){ H.scores[i] = Math.max(0, H.scores[i] + d); render(); }
function toggleTheme(){ document.documentElement.dataset.theme = currentTheme() === "dark" ? "light" : "dark"; render(); }
function toggleFS(){
  if (!canFS) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

/* ---------- Events ---------- */
app.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const i = t.dataset.i !== undefined ? +t.dataset.i : null;
  switch (t.dataset.act){
    case "start": start(); break;
    case "primary": primary(); break;
    case "back": go(H.idx - 1); break;
    case "opt": {
      const s = ss(); if (s.revealed) return;
      s.choice = s.choice === i ? null : i; render(); break;
    }
    case "claim": {
      const s = ss(); if (s.revealed) return;
      s.picks = s.picks.includes(i) ? s.picks.filter(x => x !== i) : s.picks.concat(i);
      render(); break;
    }
    case "hflip": {
      const s = ss(); if (s.revealed) return;
      memFlip(s.mem, i,
        () => { if (H.teamCount) H.scores[s.turn]++; if (s.mem.matched.length === H.pairs.length) s.revealed = true; },
        () => { if (H.teamCount) s.turn = (s.turn + 1) % H.teamCount; },
        () => { if (H.screen === "play" && cur().kind === "q" && cur().s.type === "mem") render(); });
      break;
    }
    case "ptp": addPoint(i, 1); break;
    case "ptm": addPoint(i, -1); break;
    case "timer": toggleTimer(); break;
    case "theme": toggleTheme(); break;
    case "fs": toggleFS(); break;
    case "kick": kick(t.dataset.pid); break;
    case "netretry": destroyNet(); startNet(); render(); break;
    case "setup":
      if (window.confirm(isPhones() ? "Go back to setup? The current game stops, but players stay connected." : "Go back to setup? Scores will reset.")) backToSetup();
      break;
    case "again": backToSetup(); break;
  }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "round"){
    if (t.checked) H.selected.add(t.value); else H.selected.delete(t.value);
    t.closest(".tile").classList.toggle("on", t.checked);
    $("#est").textContent = estText();
    $("#startBtn").disabled = !H.selected.size;
  }
  else if (t.name === "mode"){ H.mode = t.value; render(); }
  else if (t.name === "teams"){ H.teamCount = +t.value; render(); }
  else if (t.name === "timer"){ H.timer = +t.value; }
  else if (t.name === "atime"){ H.answerTime = +t.value; }
  else if (t.name === "mtime"){ H.memTime = +t.value; }
});
app.addEventListener("input", e => { if (e.target.name === "tname") H.teamNames[+e.target.dataset.i] = e.target.value; });

document.addEventListener("pointerdown", () => { H.kbd = false; }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Tab") H.kbd = true;
  if (H.screen !== "play" || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown"){ e.preventDefault(); primary(); }
  else if (k === "ArrowLeft" || k === "PageUp"){ e.preventDefault(); go(H.idx - 1); }
  else if ((k === " " || k === "Enter") && tag !== "button"){ e.preventDefault(); primary(); }
  else if (k === "t" || k === "T"){ toggleTimer(); }
  else if (k === "f" || k === "F"){ toggleFS(); }
  else if (/^[1-4]$/.test(k) && !isPhones()){ const n = +k - 1; if (n < H.teamCount) addPoint(n, 1); }
});
document.addEventListener("fullscreenchange", () => { if (H.screen === "play") render(); });
if (mq.addEventListener) mq.addEventListener("change", () => { if (!document.documentElement.dataset.theme) render(); });
window.addEventListener("beforeunload", e => {
  if (isPhones() && H.players.size){ e.preventDefault(); e.returnValue = ""; }
});

render();
}

/* =====================================================================
   STUDENT PHONE
   ===================================================================== */
function startPlayer(code){
  document.title = "Join | Balance the books";
  const PL = {
    code:String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4),
    pid:store.get("btb-pid") || ("p" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36)),
    name:store.get("btb-name") || "",
    status:"join", err:"", formErr:"",
    peer:null, conn:null, msg:null, sent:false, picks:[], mem:null,
    deadline:null, paused:false, retryT:null, tries:0
  };
  store.set("btb-pid", PL.pid);

  function send(o){ try { if (PL.conn && PL.conn.open) PL.conn.send(o); } catch (e){} }

  function connect(){
    clearTimeout(PL.retryT);
    if (PL.status !== "lost") PL.status = "connecting";
    render();
    if (typeof Peer === "undefined"){ fail("network"); return; }
    if (PL.peer && !PL.peer.destroyed && PL.peer.open){ openConn(); return; }
    if (PL.peer){ try { PL.peer.destroy(); } catch (e){} }
    let peer;
    try { peer = new Peer({debug:0}); } catch (e){ fail("network"); return; }
    PL.peer = peer;
    peer.on("open", () => { if (PL.peer === peer) openConn(); });
    peer.on("disconnected", () => { if (PL.peer === peer && !peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch (e){} }, 1500); });
    peer.on("error", err => {
      if (PL.peer !== peer) return;
      const type = err && err.type;
      if (PL.status === "lost"){ retryLater(); return; }
      if (PL.status === "connecting") fail(type === "peer-unavailable" ? "notfound" : "network");
    });
  }
  function openConn(){
    if (PL.conn){ const old = PL.conn; PL.conn = null; try { old.close(); } catch (e){} }
    const conn = PL.peer.connect(ID_PREFIX + PL.code.toLowerCase(), {reliable:true});
    PL.conn = conn;
    const timer = setTimeout(() => {
      if (PL.conn === conn && !conn.open){ try { conn.close(); } catch (e){} if (PL.status === "lost") retryLater(); else fail("network"); }
    }, 15000);
    conn.on("open", () => {
      clearTimeout(timer);
      if (PL.conn !== conn) return;
      PL.status = "connected"; PL.tries = 0;
      conn.send({t:"hello", pid:PL.pid, name:PL.name});
      render();
    });
    conn.on("data", d => { if (PL.conn === conn) onData(d); });
    const lost = () => { clearTimeout(timer); if (PL.conn === conn && PL.status === "connected"){ PL.status = "lost"; render(); retryLater(); } };
    conn.on("close", lost); conn.on("error", lost);
  }
  function retryLater(){
    clearTimeout(PL.retryT);
    PL.tries++;
    if (PL.tries > 40){ fail("network"); return; }
    PL.retryT = setTimeout(connect, 3000);
  }
  function fail(kind){ clearTimeout(PL.retryT); PL.status = "error"; PL.err = kind; render(); }

  function onData(d){
    if (!d || typeof d !== "object") return;
    if (d.t === "kicked"){ PL.status = "kicked"; clearTimeout(PL.retryT); store.set("btb-code", ""); render(); return; }
    if (d.t === "tick"){ PL.paused = !!d.paused; PL.deadline = d.paused ? null : Date.now() + d.left * 1000; tick(); return; }
    if (d.t !== "view") return;
    const changed = !PL.msg || d.vk !== PL.msg.vk;
    if (changed){
      PL.sent = false; PL.picks = [];
      PL.mem = d.view === "mem" ? makeDeck(d.pairs.length) : null;
      PL.paused = !!d.paused;
      PL.deadline = typeof d.left === "number" && !d.paused ? Date.now() + d.left * 1000 : null;
      if ((d.view === "q" || d.view === "mem") && navigator.vibrate){ try { navigator.vibrate(60); } catch (e){} }
    } else if (d.view === "q"){
      PL.sent = false; // the presenter has not received an answer yet
    }
    PL.msg = d;
    if (d.name) PL.name = d.name;
    render();
  }

  function tick(){
    const el = document.getElementById("cd");
    if (!el) return;
    if (PL.paused){ el.textContent = "Timer paused"; el.classList.remove("low"); return; }
    if (!PL.deadline){ el.textContent = ""; return; }
    const left = Math.max(0, Math.ceil((PL.deadline - Date.now()) / 1000));
    el.textContent = left > 0 ? `${left} seconds left` : "Time is up";
    el.classList.toggle("low", left <= 5);
  }

  function msgHTML(sub, title, text){
    return `<div class="pl-msg">${sub ? `<p class="pl-sub">${esc(sub)}</p>` : ""}<h1>${esc(title)}</h1>${text ? `<p>${esc(text)}</p>` : ""}</div>`;
  }
  function joinHTML(){
    return `<form class="pl-join" id="joinForm" novalidate>
      <h1>Join the game</h1>
      <label>Game code<input name="code" value="${esc(PL.code)}" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
      <label>Nickname<input name="nick" value="${esc(PL.name)}" maxlength="14" autocomplete="off" spellcheck="false" enterkeyhint="go"></label>
      <p class="pl-note">Your nickname shows on the big screen. Use your first name or any short name.</p>
      ${PL.formErr ? `<p class="pl-err" role="alert">${esc(PL.formErr)}</p>` : ""}
      <button class="btn primary" type="submit">Join game</button>
    </form>`;
  }
  function errHTML(){
    const t = PL.err === "notfound"
      ? ["No game found", `There is no game with the code ${PL.code} right now. Check the code on the big screen.`]
      : ["Could not connect", "The network may be blocking the game. Switch between wifi and mobile data, then try again."];
    return msgHTML("", t[0], t[1]) + `<div class="pl-actions"><button class="btn primary" data-act="pretry">Try again</button><button class="btn" data-act="prejoin">Change code or nickname</button></div>`;
  }
  function viewHTML(m){
    if (!m) return msgHTML("", "You are in", "Watch the big screen.");
    const total = `${m.score} points in total. You are ${ord(m.rank)} of ${m.n}.`;
    switch (m.view){
      case "wait": return msgHTML(m.sub || "", m.title, m.text);
      case "locked": return msgHTML("", m.title, m.text);
      case "board": return msgHTML("Leaderboard", `You are ${ord(m.rank)} of ${m.n}`, `${m.score} points so far.`);
      case "end": return `<div class="pl-msg"><p class="pl-sub">Final result</p><h1>You finished ${ord(m.rank)} of ${m.n}</h1><p>${m.score} points.</p><p>Thanks for playing. Come and talk to us about the BAcc (Hons) Accounting.</p><p><a class="pl-link" href="${COURSE_URL}" target="_blank" rel="noopener">See the course page</a></p></div>`;
      case "result": return `<div class="pl-res ${m.res.tone}"><h1>${esc(m.res.head)}</h1>${m.res.lines.map(l => `<p class="${l.charAt(0) === "+" ? "pl-gain" : ""}">${esc(l)}</p>`).join("")}<p class="pl-rank">${esc(total)}</p></div>`;
      case "mem": {
        const found = PL.mem.matched.length, n = m.pairs.length;
        if (found === n) return msgHTML("", "All pairs found", "Wait for the results on the big screen.");
        return `<p class="pl-cd" id="cd"></p><p class="pl-memstat">Pairs found: ${found} of ${n}</p>${memGridHTML(PL.mem, m.pairs, "phone", "pflip")}`;
      }
      case "q": {
        if (PL.sent) return msgHTML("", "Answer sent", "Wait for the reveal on the big screen.");
        let body;
        if (m.kind === "pick"){
          body = `<p class="pl-note">Pick ${m.need}, then send.</p><div class="pl-claims">${m.claims.map((c, i) => {
            const on = PL.picks.includes(i);
            return `<button class="pl-claim${on ? " on" : ""}" data-act="ppick" data-i="${i}" aria-pressed="${on}"><span class="c-date">${esc(c.date)}</span><span>${esc(c.item)}</span><span class="num">${esc(c.amt)}</span></button>`;
          }).join("")}</div><button class="btn primary pl-submit" data-act="psubmit"${PL.picks.length ? "" : " disabled"}>Send ${PL.picks.length === 1 ? "1 claim" : PL.picks.length + " claims"}</button>`;
        } else {
          body = `<div class="pl-opts${m.kind === "tf" ? " tf" : ""}">${m.opts.map((o, i) =>
            `<button class="opt" data-act="pans" data-i="${i}">${m.letters ? `<span class="letter" aria-hidden="true">${"ABCD"[i]}</span>` : ""}<span class="opt-text">${esc(o)}</span></button>`).join("")}</div>`;
        }
        return `<p class="pl-cd" id="cd"></p><h1 class="pl-q">${esc(m.q)}</h1>${body}`;
      }
    }
    return msgHTML("", "You are in", "Watch the big screen.");
  }
  function html(){
    const m = PL.msg;
    const me = (PL.status === "connected" || PL.status === "lost") && m
      ? `<span class="pl-me"><span>${esc(m.name)}</span><span class="pl-score">${m.score} points</span></span>` : "";
    let body;
    switch (PL.status){
      case "join": body = joinHTML(); break;
      case "connecting": body = msgHTML("", "Connecting", "This takes a few seconds. Keep this page open."); break;
      case "lost": body = msgHTML("", "Connection lost", "Trying again. Keep this page open."); break;
      case "error": body = errHTML(); break;
      case "kicked": body = msgHTML("", "You have left the game", "The presenter removed this player. Ask them if this is a mistake."); break;
      default: body = viewHTML(m);
    }
    return `<div class="pl"><header class="pl-top"><span class="pl-brand">Balance the books</span>${me}</header><main class="pl-main">${body}</main></div>`;
  }
  function render(){ app.innerHTML = html(); tick(); }

  app.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target;
    PL.code = f.code.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
    PL.name = f.nick.value.replace(/\s+/g, " ").trim().slice(0, 14);
    if (PL.code.length !== 4){ PL.formErr = "Enter the 4 character code from the big screen."; render(); return; }
    if (!PL.name){ PL.formErr = "Enter a nickname."; render(); return; }
    PL.formErr = "";
    store.set("btb-name", PL.name); store.set("btb-code", PL.code);
    PL.msg = null; PL.tries = 0;
    connect();
  });
  app.addEventListener("click", e => {
    const t = e.target.closest("[data-act]");
    if (!t || t.disabled) return;
    const i = t.dataset.i !== undefined ? +t.dataset.i : null;
    const m = PL.msg;
    switch (t.dataset.act){
      case "pans":
        if (!m || m.view !== "q" || PL.sent) return;
        PL.sent = true; send({t:"ans", qid:m.qid, choice:i}); render(); break;
      case "ppick":
        if (!m || m.view !== "q" || PL.sent) return;
        if (PL.picks.includes(i)) PL.picks = PL.picks.filter(x => x !== i);
        else { PL.picks.push(i); if (PL.picks.length > m.need) PL.picks.shift(); }
        render(); break;
      case "psubmit":
        if (!m || m.view !== "q" || PL.sent || !PL.picks.length) return;
        PL.sent = true; send({t:"ans", qid:m.qid, picks:PL.picks.slice()}); render(); break;
      case "pflip":
        if (!m || m.view !== "mem") return;
        memFlip(PL.mem, i, () => send({t:"mem", qid:m.qid, pairs:PL.mem.matched.length}), null, render);
        break;
      case "pretry": PL.tries = 0; connect(); break;
      case "prejoin":
        clearTimeout(PL.retryT);
        if (PL.peer){ try { PL.peer.destroy(); } catch (e){} PL.peer = null; }
        PL.status = "join"; render(); break;
    }
  });

  setInterval(tick, 250);
  if (PL.code.length === 4 && PL.name && store.get("btb-code") === PL.code) connect();
  else render();
}

})();
</script>
